<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>《群星之歌》商业化大厅视觉稿</title>
  <style>
    :root{
      --ink:#0b0d12;--ink-2:#141820;--paper:#f4f0e8;--muted:#aeb1b8;
      --coral:#ff674d;--coral-deep:#a73532;--violet:#7868ff;--cyan:#62e0da;
      --gold:#d8b65a;--line:rgba(244,240,232,.18);--glass:rgba(11,13,18,.84)
    }
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:var(--paper)}
    body{font-family:"Microsoft YaHei UI","Noto Sans SC",sans-serif;font-weight:500}
    button{font:inherit;color:inherit}.icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .lobby{position:relative;width:100vw;height:100vh;min-width:1100px;min-height:620px;isolation:isolate;overflow:hidden;background:#97b8d9}
    .world{position:absolute;inset:-1.5%;z-index:-5;background:url("assets/lobby-background.png") center/cover no-repeat;animation:world-in 1.6s cubic-bezier(.2,.75,.25,1) both,world-breathe 18s 1.6s ease-in-out infinite alternate}
    .lobby::before{content:"";position:absolute;inset:0;z-index:-4;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,14,.72) 0,rgba(7,9,14,.32) 17%,transparent 35%,transparent 68%,rgba(7,9,14,.2) 82%,rgba(7,9,14,.68) 100%),linear-gradient(180deg,rgba(7,9,14,.35),transparent 20%,transparent 72%,rgba(7,9,14,.7));mix-blend-mode:multiply}
    .lobby::after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;box-shadow:inset 0 0 110px rgba(5,7,11,.76);background-image:radial-gradient(rgba(255,255,255,.055) .7px,transparent .8px);background-size:4px 4px;opacity:.55}
    .brush-left,.brush-right{position:absolute;z-index:-2;pointer-events:none;filter:drop-shadow(0 12px 30px rgba(0,0,0,.25))}
    .brush-left{inset:0 auto 0 0;width:29vw;background:linear-gradient(90deg,rgba(7,9,14,.92) 0 58%,rgba(7,9,14,.68) 75%,transparent);clip-path:polygon(0 0,100% 0,83% 13%,92% 28%,76% 44%,87% 60%,68% 78%,75% 100%,0 100%)}
    .brush-right{right:0;top:0;width:30vw;height:100%;background:linear-gradient(270deg,rgba(7,9,14,.8),rgba(7,9,14,.38) 72%,transparent);clip-path:polygon(22% 0,100% 0,100% 100%,0 100%,19% 82%,8% 65%,20% 47%,9% 29%)}
    .top-rule{position:absolute;left:0;right:0;top:0;height:5px;z-index:4;background:linear-gradient(90deg,var(--coral) 0 11%,transparent 23% 76%,var(--coral) 94% 100%);opacity:.85}
    .player,.resources,.left-rail,.modes,.dock,.brand{position:absolute;z-index:5}
    .player{left:30px;top:25px;display:flex;align-items:center;gap:14px;animation:slide-right .65s .12s both}
    .portrait{position:relative;width:74px;height:74px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 65% 30%,#526174,#191d25 62%,#090b0f);border:2px solid rgba(244,240,232,.48);box-shadow:0 0 0 4px rgba(8,10,15,.62),0 0 0 6px var(--coral);overflow:hidden}
    .portrait svg{width:44px;height:44px;opacity:.9}.portrait::after{content:"28";position:absolute;right:-2px;bottom:-2px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--coral);font-size:11px;font-weight:900;box-shadow:0 0 0 3px #11141b}
    .player-meta h1{margin:0 0 6px;font-size:20px;letter-spacing:.04em}.player-meta h1 b{color:var(--coral);font-weight:900}.player-meta small{display:flex;justify-content:space-between;color:#d8d9dd;font-size:11px;letter-spacing:.06em}
    .xp{width:218px;height:5px;margin:8px 0 0;background:rgba(244,240,232,.18);transform:skewX(-18deg);overflow:hidden}.xp span{display:block;width:48%;height:100%;background:linear-gradient(90deg,var(--coral-deep),var(--coral));box-shadow:0 0 11px var(--coral)}
    .brand{left:32%;top:28px;color:rgba(244,240,232,.7);text-align:center;letter-spacing:.23em;animation:fade-down .9s .3s both}.brand strong{font-family:"STKaiti","KaiTi",serif;font-size:25px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.48)}.brand span{display:block;margin-top:3px;font-size:8px;letter-spacing:.42em;color:rgba(244,240,232,.48)}
    .resources{right:28px;top:26px;display:flex;align-items:center;gap:9px;animation:slide-left .65s .18s both}.resource{height:43px;min-width:132px;border:1px solid var(--line);background:rgba(8,10,15,.76);display:flex;align-items:center;gap:10px;padding:0 16px;clip-path:polygon(7% 0,100% 0,94% 100%,0 100%);cursor:pointer}.resource i{font-style:normal;color:var(--gold);font-size:18px}.resource.crystal i{color:var(--violet);text-shadow:0 0 12px var(--violet)}.round{width:43px;height:43px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(8,10,15,.78);cursor:pointer;transition:.18s}.round:hover{border-color:var(--coral);color:var(--coral);transform:rotate(-4deg)}
    .left-rail{left:26px;top:19%;display:grid;gap:9px;animation:slide-right .7s .25s both}.nav-row{display:flex;align-items:center;gap:8px}.nav-button{position:relative;width:128px;height:55px;border:0;background:linear-gradient(90deg,rgba(8,10,15,.92),rgba(8,10,15,.42));display:flex;align-items:center;gap:12px;padding:0 15px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);cursor:pointer;text-align:left;transition:.18s}.nav-button::after{content:"";position:absolute;left:0;bottom:0;width:0;height:3px;background:var(--coral);transition:.22s}.nav-button:hover,.nav-button.active{background:linear-gradient(90deg,rgba(167,53,50,.96),rgba(12,14,19,.58));transform:translateX(6px)}.nav-button.active::after,.nav-button:hover::after{width:72%}.nav-button b{font-size:15px;letter-spacing:.08em}.nav-button .icon{color:#fff}.task-toggle{height:39px;border:1px solid rgba(255,103,77,.5);background:rgba(8,10,15,.82);padding:0 14px;cursor:pointer;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);font-size:12px}.badge{position:absolute;top:5px;right:13px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px var(--coral)}
    .task-drawer{width:0;height:55px;overflow:hidden;opacity:0;background:rgba(8,10,15,.9);border-left:2px solid var(--coral);transition:.28s}.task-drawer.open{width:238px;opacity:1;padding:9px 13px}.task-drawer strong{display:block;font-size:12px}.task-drawer small{color:var(--muted);font-size:10px}.mini-progress{height:3px;margin-top:7px;background:#3c3e45}.mini-progress span{display:block;width:55%;height:100%;background:var(--coral)}
    .modes{right:27px;top:14.5%;width:min(410px,26vw);animation:slide-left .75s .28s both}.section-kicker{display:flex;align-items:center;gap:8px;margin:0 4px 8px;color:#dddfe4;font-size:11px;letter-spacing:.18em}.section-kicker::before{content:"";width:23px;height:2px;background:var(--coral)}
    .activity,.mode-card{position:relative;width:100%;border:0;text-align:left;overflow:hidden;cursor:pointer;color:var(--paper);isolation:isolate}
    .activity{height:132px;padding:22px 24px;background:linear-gradient(100deg,rgba(9,11,16,.96) 0 47%,rgba(14,18,27,.48) 48%),linear-gradient(135deg,#343b4b,#87615e);clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
    .activity::before{content:"";position:absolute;z-index:-1;inset:0 0 0 48%;background:radial-gradient(circle at 68% 52%,transparent 0 22%,rgba(120,104,255,.65) 23% 25%,transparent 26%),linear-gradient(145deg,transparent 42%,rgba(255,103,77,.46) 43% 46%,transparent 47%)}
    .activity::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,var(--coral),transparent)}
    .eyebrow{font-size:10px;color:var(--coral);font-weight:900;letter-spacing:.16em}.activity h2,.mode-card h3{margin:8px 0 4px}.activity h2{font-family:"STKaiti","KaiTi",serif;font-size:28px;letter-spacing:.08em}.activity p,.mode-card p{margin:0;color:#c2c4ca;font-size:11px}.card-arrow{position:absolute;right:18px;bottom:15px;font-size:22px;color:#fff;transition:.2s}.activity:hover .card-arrow,.mode-card:hover .card-arrow{transform:translateX(5px);color:var(--coral)}
    .plays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.mode-card{min-height:92px;padding:15px 17px;background:linear-gradient(115deg,rgba(9,11,16,.94),rgba(18,21,29,.82));border-left:2px solid rgba(244,240,232,.15);clip-path:polygon(0 0,100% 0,95% 100%,0 100%);transition:.18s}.mode-card.primary{grid-column:1/-1;min-height:102px}.mode-card::before{content:"";position:absolute;z-index:-1;right:-35px;bottom:-50px;width:126px;height:126px;border:22px solid rgba(120,104,255,.12);border-radius:50%}.mode-card:hover,.mode-card.active{transform:translateX(-5px);border-left-color:var(--coral);background:linear-gradient(110deg,rgba(107,37,36,.93),rgba(10,12,18,.82))}.mode-card.active{box-shadow:inset 0 -2px var(--coral)}.mode-card h3{font-size:18px;letter-spacing:.04em}.mode-card .eyebrow{font-size:9px}.mode-card .card-arrow{right:12px;bottom:8px;font-size:18px}
    .selected-mark{position:absolute;top:0;right:14px;padding:5px 9px;background:var(--coral);font-size:9px;font-weight:900;letter-spacing:.08em;transform:skewX(-12deg)}
    .dock{right:27px;bottom:24px;width:min(785px,56vw);height:106px;display:flex;align-items:flex-end;animation:fade-up .8s .42s both}.dock-rail{height:68px;flex:1;display:flex;padding:0 222px 0 14px;background:linear-gradient(90deg,rgba(8,10,15,.44),rgba(8,10,15,.92) 19%,rgba(8,10,15,.94));border-top:1px solid var(--line);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)}
    .dock-item{position:relative;flex:1;min-width:82px;border:0;background:transparent;cursor:pointer;color:#a8abb2}.dock-item b{display:block;margin-bottom:4px;font-size:17px;color:#f4f0e8}.dock-item span{font-size:10px;letter-spacing:.14em}.dock-item::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:0;background:var(--coral);transition:.18s}.dock-item:hover,.dock-item.active{color:var(--coral);background:linear-gradient(180deg,transparent,rgba(255,103,77,.14))}.dock-item.active::after{height:3px}.launch{position:absolute;right:0;bottom:0;width:248px;height:106px;border:0;padding:18px 31px;text-align:left;background:linear-gradient(125deg,#12151c 0 64%,var(--coral-deep) 64%);clip-path:polygon(11% 0,100% 0,94% 100%,0 100%);cursor:pointer;filter:drop-shadow(0 10px 24px rgba(0,0,0,.32));transition:.2s}.launch::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,103,77,.55);clip-path:inherit}.launch:hover{transform:translateY(-5px);background:linear-gradient(125deg,#151923 0 58%,var(--coral) 58%)}.launch b{position:relative;display:block;font-family:"STKaiti","KaiTi",serif;font-size:28px;letter-spacing:.06em}.launch small{position:relative;color:#c4c5ca;font-size:11px;letter-spacing:.12em}.launch .go{position:absolute;right:23px;top:43px;font-size:28px}.launch-glint{position:absolute;inset:0;background:linear-gradient(105deg,transparent 28%,rgba(255,255,255,.17) 42%,transparent 55%);transform:translateX(-110%);animation:glint 4.8s 2.2s infinite}
    .context{position:absolute;left:31.8%;bottom:10%;z-index:2;color:rgba(244,240,232,.78);text-shadow:0 2px 12px #000;animation:fade-up .8s .55s both}.context span{display:block;font-size:9px;letter-spacing:.35em;color:var(--coral)}.context strong{font-family:"STKaiti","KaiTi",serif;font-size:20px;letter-spacing:.08em}.context::before{content:"";position:absolute;left:-33px;top:7px;width:22px;height:1px;background:var(--coral)}
    .stars{position:absolute;inset:0;z-index:-1;pointer-events:none}.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 9px var(--violet);animation:twinkle 2.4s infinite alternate}.star:nth-child(1){left:44%;top:23%;animation-delay:.2s}.star:nth-child(2){left:51%;top:31%;animation-delay:.8s}.star:nth-child(3){left:60%;top:19%;animation-delay:1.4s}.star:nth-child(4){left:67%;top:38%;animation-delay:1.9s}
    .toast{position:fixed;left:50%;bottom:25px;z-index:50;transform:translate(-50%,35px);opacity:0;padding:11px 28px;background:#0b0d12;border-left:3px solid var(--coral);box-shadow:0 10px 35px rgba(0,0,0,.5);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(4,6,9,.72);backdrop-filter:blur(7px)}.modal.open{display:grid}.modal-card{position:relative;width:min(520px,88vw);padding:35px 40px;background:linear-gradient(135deg,#171b23,#0b0d12);border:1px solid var(--line);clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:modal-in .25s both}.modal-card::before{content:"";position:absolute;left:0;top:0;width:45%;height:4px;background:var(--coral)}.modal-card .eyebrow{font-size:11px}.modal-card h2{margin:8px 0;font-family:"STKaiti","KaiTi",serif;font-size:32px}.modal-card p{color:var(--muted);line-height:1.65}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.modal-actions button{min-width:110px;padding:12px;border:1px solid var(--line);background:#20242c;cursor:pointer}.modal-actions .confirm{background:var(--coral-deep);border-color:var(--coral)}
    @keyframes world-in{from{opacity:.35;transform:scale(1.08)}to{opacity:1;transform:scale(1.015)}}@keyframes world-breathe{to{transform:scale(1.035) translate3d(-.25%,.18%,0)}}
    @keyframes slide-right{from{opacity:0;transform:translateX(-35px)}to{opacity:1;transform:none}}@keyframes slide-left{from{opacity:0;transform:translateX(35px)}to{opacity:1;transform:none}}@keyframes fade-up{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes fade-down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}@keyframes twinkle{to{opacity:.2;transform:scale(.4)}}@keyframes glint{0%,62%{transform:translateX(-110%)}82%,100%{transform:translateX(110%)}}@keyframes modal-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
    @media(max-width:1450px){.modes{width:350px}.dock{width:690px}.brand{display:none}.player-meta .xp{width:180px}.nav-button{width:112px}.context{display:none}}
    @media(max-height:760px){.left-rail{top:18%;gap:5px}.nav-button{height:47px}.activity{height:108px;padding:15px 20px}.activity h2{font-size:24px}.mode-card{min-height:75px;padding:10px 14px}.mode-card.primary{min-height:82px}.dock{bottom:14px}.modes{top:13%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="lobby" aria-label="群星之歌游戏大厅">
    <div class="world" aria-hidden="true"></div><div class="brush-left" aria-hidden="true"></div><div class="brush-right" aria-hidden="true"></div><div class="top-rule"></div>
    <div class="stars" aria-hidden="true"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>

    <section class="player" aria-label="玩家信息">
      <div class="portrait"><svg class="icon" viewBox="0 0 24 24"><path d="M6 20c1.2-3.7 3-5.5 6-5.5s4.8 1.8 6 5.5M8.2 8.8a3.8 3.8 0 1 0 7.6 0 3.8 3.8 0 0 0-7.6 0Z"/></svg></div>
      <div class="player-meta"><h1>旅行者 <b>·</b> Lv.28</h1><small><span>探索经验</span><span>3520 / 7200</span></small><div class="xp"><span></span></div></div>
    </section>

    <div class="brand"><strong>群星之歌</strong><span>CHORUS OF STARS</span></div>

    <section class="resources" aria-label="全局资源">
      <button class="resource" data-toast="金币：用于日常补给与养成"><i>●</i><b>128,760</b></button>
      <button class="resource crystal" data-toast="星光结晶：用于稀有招募与兑换"><i>◆</i><b>6,420</b></button>
      <button class="round" aria-label="邮件" data-toast="邮件：2封未读"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 7l9 7 9-7"/></svg></button>
      <button class="round" aria-label="设置" data-toast="打开设置"><svg class="icon" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19 13.8l1.5 1.2-2 3.4-1.9-.7a7.8 7.8 0 0 1-2.1 1.2l-.3 2.1h-4l-.3-2.1a7.8 7.8 0 0 1-2.1-1.2l-1.9.7-2-3.4 1.5-1.2a7 7 0 0 1 0-2.5L4 10.1l2-3.4 1.9.7a7.8 7.8 0 0 1 2.1-1.2l.3-2.1h4l.3 2.1a7.8 7.8 0 0 1 2.1 1.2l1.9-.7 2 3.4-1.5 1.2a7 7 0 0 1-.1 2.5Z"/></svg></button>
    </section>

    <nav class="left-rail" aria-label="日常与运营入口">
      <div class="nav-row">
        <button class="nav-button active" data-name="签到"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5h14v15H5zM8 3v4M16 3v4M5 9h14M8 14l2.2 2.2L16 11"/></svg><b>签到</b><i class="badge"></i></button>
        <button class="task-toggle" aria-expanded="false">任务 2/4</button>
        <div class="task-drawer"><strong>今日：完成一次遗迹讨伐</strong><small>奖励 星光结晶 ×30</small><div class="mini-progress"><span></span></div></div>
      </div>
      <button class="nav-button" data-name="商城"><svg class="icon" viewBox="0 0 24 24"><path d="M4 9h16l-1 11H5L4 9ZM8 9c0-3 1.4-5 4-5s4 2 4 5"/></svg><b>商城</b></button>
      <button class="nav-button" data-name="活动"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7h14v13H5zM8 4v6M16 4v6M5 11h14M9 15h2M14 15h2"/></svg><b>活动</b><i class="badge"></i></button>
      <button class="nav-button" data-name="排行"><svg class="icon" viewBox="0 0 24 24"><path d="M7 20v-7h4v7M13 20V8h4v12M3 20v-4h4v4M3 20h18M15 4l2-1 2 1-.7 2.1L19 8l-2-.8-2 .8.7-1.9Z"/></svg><b>排行</b></button>
    </nav>

    <section class="modes" aria-label="当前活动和玩法">
      <div class="section-kicker">冒险指引 / ADVENTURE</div>
      <button class="activity" data-mode="远古回响"><span class="eyebrow">当前活动 · 剩余12天</span><h2>远古回响</h2><p>追随星痕，揭开失落文明的秘密</p><span class="card-arrow">→</span></button>
      <div class="plays" aria-label="三种玩法">
        <button class="mode-card primary active" data-mode="遗迹讨伐"><span class="selected-mark">当前</span><span class="eyebrow">核心玩法 01</span><h3>遗迹讨伐</h3><p>探索 · 战斗 · 随机构筑</p><span class="card-arrow">→</span></button>
        <button class="mode-card" data-mode="星轨竞速"><span class="eyebrow">跑酷玩法 02</span><h3>星轨竞速</h3><p>穿越断桥与机关</p><span class="card-arrow">→</span></button>
        <button class="mode-card" data-mode="星牌演算"><span class="eyebrow">卡牌玩法 03</span><h3>星牌演算</h3><p>构筑你的星光牌组</p><span class="card-arrow">→</span></button>
      </div>
    </section>

    <div class="context"><span>卡利曼帝国 · 前线营地</span><strong>星环遗迹 / 入口观测中</strong></div>

    <nav class="dock" aria-label="角色与资料功能">
      <div class="dock-rail">
        <button class="dock-item" data-name="图鉴"><b>册</b><span>图鉴</span></button>
        <button class="dock-item" data-name="地图"><b>图</b><span>地图</span></button>
        <button class="dock-item active" data-name="角色"><b>人</b><span>角色</span></button>
        <button class="dock-item" data-name="背包"><b>包</b><span>背包</span></button>
      </div>
      <button class="launch" id="launch"><i class="launch-glint"></i><b>开始冒险</b><small id="launch-mode">遗迹讨伐</small><span class="go">→</span></button>
    </nav>
  </main>

  <div class="toast" role="status"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="modal-card"><span class="eyebrow">出发确认 / READY</span><h2 id="modal-title">前往星环遗迹</h2><p>当前玩法：<strong id="selected-mode">遗迹讨伐</strong></p><p>队伍将从卡利曼前线营地出发。本次探索中的遗物、路线与遭遇将随机生成。</p><div class="modal-actions"><button id="cancel">暂不出发</button><button class="confirm" id="confirm">确认出发</button></div></section>
  </div>

  <script>
    const toast=document.querySelector('.toast');let timer;
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1500)}
    document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.toast)));
    document.querySelectorAll('.nav-button').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.nav-button').forEach(x=>x.classList.remove('active'));el.classList.add('active');showToast(`进入${el.dataset.name}`)}));
    const taskToggle=document.querySelector('.task-toggle'),taskDrawer=document.querySelector('.task-drawer');
    taskToggle.addEventListener('click',()=>{const open=taskDrawer.classList.toggle('open');taskToggle.setAttribute('aria-expanded',String(open));taskToggle.textContent=open?'收起任务':'任务 2/4'});
    const modeButtons=document.querySelectorAll('[data-mode]');
    modeButtons.forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.mode-card').forEach(x=>x.classList.remove('active'));if(el.classList.contains('mode-card'))el.classList.add('active');document.querySelector('#launch-mode').textContent=el.dataset.mode;document.querySelector('#selected-mode').textContent=el.dataset.mode;showToast(`已选择：${el.dataset.mode}`)}));
    document.querySelectorAll('.dock-item').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.dock-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');showToast(`进入${el.dataset.name}`)}));
    const modal=document.querySelector('.modal');document.querySelector('#launch').addEventListener('click',()=>modal.classList.add('open'));document.querySelector('#cancel').addEventListener('click',()=>modal.classList.remove('open'));document.querySelector('#confirm').addEventListener('click',()=>{modal.classList.remove('open');showToast('队伍整备完成，即将出发')});modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
  </script>
</body>
</html>
