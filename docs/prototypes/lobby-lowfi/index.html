<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>《群星之歌》大厅布局原型 v2</title>
  <style>
    :root{--ink:#121319;--panel:rgba(17,18,24,.86);--paper:#f2f0eb;--muted:#aaa9b2;--line:rgba(255,255,255,.18);--violet:#7657f6;--violet2:#473292;--gold:#d3ae60}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;overflow:hidden;background:#30353e;color:var(--paper);font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}button{font:inherit;color:inherit}.scene{position:relative;min-height:100vh;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,rgba(111,126,150,.42),rgba(46,51,60,.12) 46%,rgba(18,19,24,.72)),linear-gradient(118deg,#343c47 0 22%,#737b84 22% 63%,#3b414a 63%)}.scene:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 58% 25%,transparent 0 8%,#282d36 8.5% 10%,transparent 10.5%),linear-gradient(140deg,transparent 0 44%,rgba(20,22,27,.72) 44.5% 47%,transparent 47.5%) 57% 20%/38% 55% no-repeat,linear-gradient(40deg,transparent 0 47%,rgba(20,22,27,.58) 47.5% 50%,transparent 50.5%) 67% 22%/34% 57% no-repeat;opacity:.88}.scene:after{content:"虚化旗帜与补给物资";position:absolute;left:-4%;bottom:-6%;z-index:-1;width:31%;height:30%;display:grid;place-items:center;color:rgba(255,255,255,.3);background:#15161b;border-radius:52% 48% 0 0;filter:blur(2px);transform:rotate(-4deg);font-size:13px}.world-note{position:absolute;left:42%;top:17%;width:34%;text-align:center;color:rgba(255,255,255,.7);letter-spacing:.13em;font-weight:800}.world-note small{display:block;margin-top:8px;color:rgba(255,255,255,.44);font-weight:400}.character-note{position:absolute;left:38%;bottom:15%;width:240px;height:42%;display:grid;place-items:end center;color:rgba(255,255,255,.52);background:linear-gradient(180deg,transparent 0 25%,rgba(18,19,24,.52));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.player,.resources,.left-actions,.game-modes,.bottom-dock{position:absolute;z-index:5}.player{left:30px;top:24px;display:flex;align-items:center;gap:14px}.avatar{width:68px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--ink);border:3px solid var(--violet);font-weight:800}.player h1{font-size:21px;margin:0 0 6px}.player p{font-size:12px;margin:5px 0;color:var(--muted)}.xp{width:220px;height:6px;background:rgba(255,255,255,.15)}.xp span{display:block;width:46%;height:100%;background:var(--violet)}.resources{right:28px;top:26px;display:flex;align-items:center;gap:9px}.pill,.round{border:1px solid var(--line);background:var(--panel);cursor:pointer}.pill{min-width:126px;padding:10px 16px;border-radius:999px}.pill b{color:var(--gold);margin-right:8px}.round{width:44px;height:44px;border-radius:50%}.left-actions{left:28px;top:18%;display:grid;gap:12px}.left-row{display:flex;align-items:center;gap:8px}.left-button{width:96px;height:52px;display:flex;align-items:center;gap:10px;border:0;background:linear-gradient(90deg,var(--panel),rgba(17,18,24,.38));cursor:pointer;text-align:left;padding:0 12px;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%)}.left-button i{font-style:normal;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.left-button:hover,.left-button.active{box-shadow:inset 4px 0 var(--violet);background:linear-gradient(90deg,rgba(61,45,120,.92),rgba(17,18,24,.46))}.task-chip{width:48px;height:38px;border:1px solid var(--line);background:var(--panel);cursor:pointer}.task-panel{display:none;width:220px;padding:12px 14px;background:var(--panel);border-left:3px solid var(--violet)}.task-panel.open{display:block}.task-panel strong{display:block;margin-bottom:5px}.task-panel small{color:var(--muted)}.game-modes{right:28px;top:15%;width:min(390px,29vw);display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode-card{position:relative;min-height:112px;padding:15px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;overflow:hidden}.mode-card:after{content:"";position:absolute;right:-25px;bottom:-32px;width:95px;height:95px;border:18px solid rgba(118,87,246,.15);border-radius:50%}.mode-card.featured{grid-column:1/-1;min-height:145px;background:linear-gradient(105deg,rgba(17,18,24,.96) 0 46%,rgba(37,39,48,.7) 46%)}.mode-card.active{border-color:var(--violet);box-shadow:inset 4px 0 var(--violet)}.mode-card .tag{color:#ac9bff;font-size:11px;font-weight:800;letter-spacing:.1em}.mode-card h2{margin:8px 0 5px;font-size:21px}.mode-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.mode-card.featured h2{font-size:26px}.mode-card .arrow{position:absolute;right:14px;bottom:12px;color:#c8beff;font-size:20px;z-index:1}.bottom-dock{right:28px;bottom:26px;height:92px;width:min(760px,60vw);display:flex;align-items:flex-end}.dock-strip{height:64px;flex:1;display:flex;align-items:stretch;padding-left:12px;padding-right:176px;background:linear-gradient(90deg,rgba(17,18,24,.76),rgba(17,18,24,.94));border-top:1px solid var(--line);clip-path:polygon(2% 0,100% 0,98% 100%,0 100%)}.dock-item{flex:1;min-width:72px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted);position:relative}.dock-item:hover,.dock-item.active{color:#fff;background:linear-gradient(180deg,transparent,var(--violet2))}.dock-item b{display:block;font-size:18px}.dock-item span{font-size:12px}.launch{position:absolute;right:0;bottom:0;width:210px;height:92px;border:1px solid var(--violet);background:linear-gradient(125deg,#14151b 0 66%,var(--violet2) 66%);cursor:pointer;text-align:left;padding:18px 22px;clip-path:polygon(8% 0,100% 0,94% 100%,0 100%)}.launch b{display:block;font-size:25px}.launch small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;z-index:20;transform:translate(-50%,30px);padding:11px 19px;background:#0d0e12;border:1px solid var(--violet);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(7,8,11,.72);backdrop-filter:blur(4px)}.modal.open{display:grid}.modal-card{width:min(470px,90vw);padding:26px;background:#15161b;border:1px solid var(--line)}.modal-card h2{margin:6px 0}.modal-card p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.modal-actions button{padding:10px 17px;background:#272932;border:1px solid var(--line);cursor:pointer}.modal-actions .primary{background:var(--violet);border-color:var(--violet)}
    @media(max-width:1000px){.game-modes{width:330px}.bottom-dock{width:650px}.character-note{left:32%}}@media(max-width:760px){body{overflow:auto}.scene{min-height:820px}.player{left:14px}.xp{width:135px}.resources{right:14px}.pill{min-width:0;padding:8px 10px}.left-actions{left:10px;top:19%}.left-button{width:52px}.left-button span{display:none}.game-modes{right:12px;top:20%;width:250px;grid-template-columns:1fr}.mode-card.featured{grid-column:auto}.mode-card{min-height:90px}.bottom-dock{right:12px;width:92vw}.dock-strip{padding-right:155px}.launch{width:180px}.world-note{left:27%;width:48%;top:12%}.character-note{left:30%;bottom:19%;height:35%}}
    /* 活动与玩法分层：上方1张活动卡，下方明确3张玩法卡 */
    .game-modes{grid-template-columns:1fr}.play-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode-card.featured{grid-column:auto}.mode-card.primary-mode{grid-column:1/-1;min-height:104px}
    @media(max-width:760px){.play-list{grid-template-columns:1fr}.mode-card.primary-mode{grid-column:auto}}
  </style>
</head>
<body>
  <main class="scene" aria-label="群星之歌大厅布局原型">
    <div class="world-note">远古环形遗迹<small>蜿蜒道路 · 断桥 · 帝国关卡 · 前线营地</small></div><div class="character-note">大厅动态角色 / 营地互动</div>
    <section class="player"><div class="avatar">头像</div><div><h1>旅行者 · Lv.28</h1><div class="xp"><span></span></div><p>经验 3520 / 7200</p></div></section>
    <section class="resources"><button class="pill" data-toast="金币详情"><b>●</b>128,760</button><button class="pill" data-toast="星光结晶详情"><b>◆</b>6,420</button><button class="round" data-toast="邮件：2封未读">✉</button><button class="round" data-toast="打开设置">⚙</button></section>
    <nav class="left-actions" aria-label="运营入口"><div class="left-row"><button class="left-button active" data-name="签到"><i>签</i><span>签到</span></button><button class="task-chip" aria-expanded="false">任务</button><section class="task-panel"><strong>今日任务 2 / 4</strong><small>平时收起，点击后就地展开。</small></section></div><button class="left-button" data-name="商城"><i>店</i><span>商城</span></button><button class="left-button" data-name="活动"><i>活</i><span>活动</span></button><button class="left-button" data-name="排行"><i>榜</i><span>排行</span></button></nav>
    <section class="game-modes" aria-label="一张活动卡和三张玩法卡"><button class="mode-card featured" data-mode="远古回响"><span class="tag">当前活动</span><h2>远古回响</h2><p>限时活动展示 · 剩余12天</p><span class="arrow">→</span></button><div class="play-list" aria-label="三种玩法"><button class="mode-card primary-mode active" data-mode="遗迹讨伐"><span class="tag">核心玩法 01</span><h2>遗迹讨伐</h2><p>探索、战斗、获取至宝</p><span class="arrow">→</span></button><button class="mode-card" data-mode="星轨竞速"><span class="tag">跑酷玩法 02</span><h2>星轨竞速</h2><p>穿越机关与断裂遗迹</p><span class="arrow">→</span></button><button class="mode-card" data-mode="星牌演算"><span class="tag">卡牌玩法 03</span><h2>星牌演算</h2><p>构筑星光牌组挑战</p><span class="arrow">→</span></button></div></section>
    <nav class="bottom-dock" aria-label="角色与资料功能"><div class="dock-strip"><button class="dock-item" data-name="图鉴"><b>册</b><span>图鉴</span></button><button class="dock-item" data-name="地图"><b>图</b><span>地图</span></button><button class="dock-item active" data-name="角色"><b>人</b><span>角色</span></button><button class="dock-item" data-name="背包"><b>包</b><span>背包</span></button></div><button class="launch" id="launch"><b>开始冒险 →</b><small id="launch-mode">遗迹讨伐</small></button></nav>
  </main>
  <div class="toast" role="status"></div><div class="modal" role="dialog" aria-modal="true"><section class="modal-card"><span style="color:#ac9bff;font-size:12px">出发确认</span><h2>开始冒险</h2><p>当前选择：<strong id="selected-mode">遗迹讨伐</strong></p><p>大厅只呈现玩法选择与高频入口，详细养成和资料进入独立页面。</p><div class="modal-actions"><button id="cancel">返回</button><button class="primary" data-toast="原型：已确认出发">确认出发</button></div></section></div>
  <script>
    const toast=document.querySelector('.toast');let timer;function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1300)}document.querySelectorAll('[data-toast]').forEach(x=>x.addEventListener('click',()=>showToast(x.dataset.toast)));document.querySelectorAll('.left-button').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.left-button').forEach(y=>y.classList.remove('active'));x.classList.add('active');showToast(`进入${x.dataset.name}`)}));const taskChip=document.querySelector('.task-chip'),taskPanel=document.querySelector('.task-panel');taskChip.addEventListener('click',()=>{const open=taskPanel.classList.toggle('open');taskChip.setAttribute('aria-expanded',String(open))});document.querySelectorAll('.mode-card').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.mode-card').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector('#launch-mode').textContent=x.dataset.mode;document.querySelector('#selected-mode').textContent=x.dataset.mode;showToast(`已选择：${x.dataset.mode}`)}));document.querySelectorAll('.dock-item').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.dock-item').forEach(y=>y.classList.remove('active'));x.classList.add('active');showToast(`进入${x.dataset.name}`)}));const modal=document.querySelector('.modal');document.querySelector('#launch').addEventListener('click',()=>modal.classList.add('open'));document.querySelector('#cancel').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
  </script>
</body>
</html>
